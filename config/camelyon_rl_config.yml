## RL hyper parameters
train_epoch: 15
num_envs: 2
B: 1
warmup_epoch: 0
wd: 0.0001
lr: 0.00001
min_lr: 0
n_class: 2

# Other Hyper parameters
explore_frac: 0.05
gamma: 1.0
# clip: 0.1
clip: 0.2 # for sasha 0.1
entropy_coef: 0.001
use_entropy_loss: True
max_grad_norm: 0.5
num_epochs_on_single_roll_out: 4
only_ce_as_reward: True
use_gae: True
